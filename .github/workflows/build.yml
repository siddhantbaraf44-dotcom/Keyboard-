name: Build Ice APK

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Build variant"
        default: arm64
        type: choice
        options:
          - arm64
          - arm
          - x86_64

jobs:
  build:
    runs-on: ${{ vars.BUILD_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Unzip Ice-source.zip
        run: |
          test -f Ice-source.zip || { echo "Ice-source.zip not found"; exit 1; }
          mkdir ice-src
          unzip -q Ice-source.zip -d ice-src
          cp -a ice-src/. .
          rm -rf ice-src
          test -f scripts/build.sh || { echo "scripts/build.sh missing after unzip"; exit 1; }

      - name: Build builder image
        run: docker build -t ice-builder -f Containerfile .

      - name: Get sources, patch and build
        env:
          ARCH: ${{ github.event.inputs.arch }}
        run: |
          docker run --rm -v "$PWD:/app" -e IRONFOX_RELEASE=1 ice-builder /bin/bash -euxo pipefail -c "
            ./scripts/get_sources.sh
            ./scripts/prebuild.sh
            ./scripts/build.sh $ARCH
          "

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ice-${{ github.event.inputs.arch }}
          path: |
            outputs/apk/**
            outputs/unsigned/**
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            outputs/**/*.log
            build/**/*.log
          if-no-files-found: ignore
